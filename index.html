<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Panatta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F4F5F1;
    --surface: #FFFFFF;
    --surface-2: #FBFBF9;
    --text: #1C1B19;
    --text-muted: #6B6860;
    --border: #E3E1DB;
    --accent: #D6472B;
    --accent-ink: #FFFFFF;
    --cat-push: #C9633B;
    --cat-pull: #3E7C8C;
    --cat-legs: #6E8F5B;
    --cat-core: #7C6199;
    --muscle-primary: #C23B2E;
    --muscle-secondary: #D9A62E;
    --muscle-none: #DEDBD3;
    --muscle-outline: #B9B6AC;
    --shadow: 0 1px 2px rgba(28,27,25,0.07), 0 10px 24px -14px rgba(28,27,25,0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161A;
      --surface: #201F24;
      --surface-2: #242228;
      --text: #EDEAE4;
      --text-muted: #A8A39B;
      --border: #34323A;
      --accent: #FF6B45;
      --accent-ink: #1C1B19;
      --cat-push: #E38257;
      --cat-pull: #5FA6B8;
      --cat-legs: #92B27B;
      --cat-core: #A587C4;
      --muscle-primary: #E2574A;
      --muscle-secondary: #E6B84A;
      --muscle-none: #34323A;
      --muscle-outline: #48454C;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 24px -14px rgba(0,0,0,0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #17161A;
    --surface: #201F24;
    --surface-2: #242228;
    --text: #EDEAE4;
    --text-muted: #A8A39B;
    --border: #34323A;
    --accent: #FF6B45;
    --accent-ink: #1C1B19;
    --cat-push: #E38257;
    --cat-pull: #5FA6B8;
    --cat-legs: #92B27B;
    --cat-core: #A587C4;
    --muscle-primary: #E2574A;
    --muscle-secondary: #E6B84A;
    --muscle-none: #34323A;
    --muscle-outline: #48454C;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 24px -14px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 72px;
    --cat: var(--cat-push);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    margin: 0 -20px;
  }

  .tabs {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
  }

  .tab {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 14px 0 10px;
    border-radius: 11px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .tab__letter {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--tabcat);
  }

  .tab[aria-selected="true"] {
    color: var(--text);
    background: color-mix(in srgb, var(--tabcat) 14%, var(--surface));
    border-color: color-mix(in srgb, var(--tabcat) 45%, transparent);
  }

  .masthead {
    padding: 28px 0 4px;
  }

  .eyebrow {
    margin: 0 0 10px;
    font-weight: 700;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
  }

  h1 {
    margin: 0 0 6px;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 2.9rem);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 0.95;
  }

  .dayFocus {
    margin: 0;
    font-size: 0.86rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .diagrams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 22px;
  }

  .diagram-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 6px 12px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .diagram-label {
    margin: 2px 0 6px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .diagram-card svg {
    width: 100%;
    max-width: 190px;
    height: auto;
  }

  .silhouette-base rect,
  .silhouette-base ellipse {
    fill: var(--muscle-none);
    stroke: var(--muscle-outline);
    stroke-width: 1.5;
  }

  .muscle {
    stroke: var(--muscle-outline);
    stroke-width: 1.5;
    transition: fill 0.15s ease;
  }

  .muscle[data-state="primary"] { fill: var(--muscle-primary); }
  .muscle[data-state="secondary"] { fill: var(--muscle-secondary); }
  .muscle[data-state="none"] { fill: var(--muscle-none); }

  .legend {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin: 14px 0 0;
    padding: 0;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .legend li {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot--primary { background: var(--muscle-primary); }
  .dot--secondary { background: var(--muscle-secondary); }
  .dot--none { background: var(--muscle-none); border: 1px solid var(--muscle-outline); }

  main { margin-top: 26px; }

  .warmup {
    margin: 0 0 16px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 0.88rem;
    color: var(--text-muted);
  }

  .warmup strong { color: var(--text); }

  .exlist {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .exercise {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  .exercise__row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .exercise__row h3 {
    margin: 0;
    flex: 1;
    font-weight: 700;
    font-size: 1.02rem;
    line-height: 1.3;
  }

  .tag {
    flex-shrink: 0;
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    color: var(--cat);
    background: color-mix(in srgb, var(--cat) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--cat) 42%, transparent);
  }

  .meta {
    margin: 8px 0 0;
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .cue {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .colophon {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  @media (max-width: 420px) {
    .diagrams { gap: 8px; }
  }
</style>
</head>

      warmupMin: 6,
      muscles: { abs: 'primary', obliques: 'primary', shoulders: 'secondary', quads: 'secondary' },
      exercises: [
        { name: 'Plancha', sets: 3, reps: 10, rest: '1:00', tag: 'Abdomen',
          cue: 'Apoyado en los antebrazos y las puntas de los pies, mantén el cuerpo recto como una tabla sin dejar caer la cadera.' },
        { name: 'Elevación de piernas colgado', sets: 3, reps: 10, rest: '1:00', tag: 'Abdomen bajo',
          cue: 'Colgado de una barra con los brazos estirados, sube las piernas hacia el pecho sin balancearte.' },
        { name: 'Giro ruso', sets: 3, reps: 10, rest: '1:00', tag: 'Oblicuos',
          cue: 'Sentado con el torso inclinado hacia atrás y los pies levantados, gira de lado a lado tocando el piso.' },
        { name: 'Crunch de bicicleta', sets: 3, reps: 10, rest: '1:00', tag: 'Abdomen / oblicuos',
          cue: 'Acostado boca arriba, lleva el codo hacia la rodilla contraria alternando, como si pedalearas.' },
        { name: 'Escalador de montaña', sets: 3, reps: 10, rest: '1:00', tag: 'Abdomen / cardio',
          cue: 'En posición de plancha con los brazos estirados, lleva las rodillas al pecho alternando rápido, como si escalaras.' }
      ]
    }
  ];

  const ALL_MUSCLE_KEYS = ['chest','shoulders','biceps','triceps','upper-back','lower-back','abs','obliques','quads','hamstrings','glutes','calves'];

  const tabsEl = document.getElementById('tabs');
  const appEl = document.getElementById('app');

  DAYS.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.id = 'tab-' + day.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', 'false');
    btn.style.setProperty('--tabcat', `var(--cat-${day.cat})`);
    btn.innerHTML = `<span class="tab__letter">${day.letter}</span><span>${day.name}</span>`;
    btn.addEventListener('click', () => renderDay(day.id));
    tabsEl.appendChild(btn);
  });

  function applyMuscles(map) {
    ALL_MUSCLE_KEYS.forEach(key => {
      const state = map[key] || 'none';
      document.querySelectorAll(`[data-muscle="${key}"]`).forEach(el => el.setAttribute('data-state', state));
    });
  }

  function renderDay(id) {
    const day = DAYS.find(d => d.id === id);
    if (!day) return;

    DAYS.forEach(d => {
      const t = document.getElementById('tab-' + d.id);
      t.setAttribute('aria-selected', d.id === id ? 'true' : 'false');
    });

    appEl.style.setProperty('--cat', `var(--cat-${day.cat})`);
    document.getElementById('dayName').textContent = day.letter + ' · ' + day.name;
    document.getElementById('dayFocusText').textContent = day.focus;
    document.getElementById('warmup').innerHTML = `<strong>Calentamiento</strong> — ${day.warmupMin}:00 cardio`;

    applyMuscles(day.muscles);

    const ul = document.getElementById('exlist');
    ul.innerHTML = '';
    day.exercises.forEach(ex => {
      const li = document.createElement('li');
      li.className = 'exercise';
      li.innerHTML = `
        <div class="exercise__row">
          <h3>${ex.name}</h3>
          <span class="tag">${ex.tag}</span>
        </div>
        <p class="meta">${ex.sets} series &times; ${ex.reps} rep &middot; descanso ${ex.rest}</p>
        <p class="cue">${ex.cue}</p>
      `;
      ul.appendChild(li);
    });
  }

  renderDay('a');
</script>

</body>
</html>
